<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kWh UI Bank</title>
<meta name="description" content="Every kWh Electric deck UI component built so far — browse by category, click to view full-size.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Forced light theme, always — this is a screenshot-source tool, never dark,
     regardless of the viewer's OS/browser theme preference. */
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#0B0F0C;
    --ink-muted:rgba(11,15,12,.6); --ink-faint:rgba(11,15,12,.4);
    --line:#E4EAE5; --accent:#16A34A; --accent-bg:#EAF7EE; --chip-bg:#F5F6F5;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ color-scheme:light; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:'DM Sans',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .topbar{
    position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line);
    padding:18px 32px 0;
  }
  .topbar-inner{ max-width:1400px; margin:0 auto; }
  .topbar-row{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .eyebrow{ font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.02em; }
  h1{ font-size:24px; font-weight:800; margin:2px 0 0; letter-spacing:-.01em; text-wrap:balance; }
  .sub{ font-size:13px; color:var(--ink-muted); max-width:620px; line-height:1.5; margin:4px 0 14px; }

  .filters{ display:flex; gap:8px; flex-wrap:wrap; padding-bottom:14px; }
  .chip{
    font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-muted);
    background:var(--chip-bg); border:1px solid transparent; border-radius:999px;
    padding:6px 13px; cursor:pointer; transition:background .12s,color .12s;
  }
  .chip:hover{ color:var(--ink); }
  .chip.on{ background:var(--accent); color:#fff; }
  .chip .n{ opacity:.7; margin-left:3px; }

  main{ max-width:1400px; margin:0 auto; padding:22px 32px 80px; }
  section.cat{ margin-bottom:34px; }
  section.cat h2{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin-bottom:12px; display:flex; align-items:baseline; gap:8px;
  }
  section.cat h2 .n{ font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-faint); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(224px,1fr)); gap:14px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden;
    cursor:pointer; transition:transform .12s, border-color .12s, box-shadow .12s; display:flex; flex-direction:column;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.06); }
  .thumb{
    height:150px; background:#FFFFFF; display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .thumb iframe{ border:0; pointer-events:none; background:#fff; flex-shrink:0; }
  .card-foot{ padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-title{ font-size:12.5px; font-weight:700; line-height:1.3; }
  .card-tag{ font-size:9.5px; font-weight:700; color:var(--accent); background:var(--accent-bg); border-radius:999px; padding:3px 8px; white-space:nowrap; flex-shrink:0; }

  /* modal viewer — reads as its own page, not a popup, per "back to main page" */
  .modal{
    position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column;
    z-index:100;
  }
  .modal.open{ display:flex; }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; padding:14px 24px;
    border-bottom:1px solid var(--line); flex-shrink:0; gap:16px;
  }
  .back-btn{
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink); background:var(--chip-bg);
    border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer;
    display:flex; align-items:center; gap:7px; flex-shrink:0;
  }
  .back-btn:hover{ background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }
  .modal-title{ font-size:14px; font-weight:700; color:var(--ink-muted); flex:1; text-align:center; }
  .modal-nav{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:transparent;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit;
    font-size:16px;
  }
  .icon-btn:hover{ background:var(--chip-bg); }
  .modal-body{ flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:36px; background:#FFFFFF; }
  .modal-body iframe{ border:0; background:#fff; flex-shrink:0; }

  .empty{ font-size:13px; color:var(--ink-faint); padding:40px 0; text-align:center; }

  ::selection{ background:var(--accent-bg); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row">
      <div>
        <div class="eyebrow">kWh Electric</div>
        <h1>UI bank</h1>
      </div>
    </div>
    <div class="sub">The main reference for every deck UI component built so far. Click any template to open it full-size — that's the crop to paste into the deck.</div>
    <div class="filters" id="filters"></div>
  </div>
</div>

<main id="main"></main>

<div class="modal" id="modal">
  <div class="modal-head">
    <button class="back-btn" id="closeBtn">← Back to library</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-nav">
      <button class="icon-btn" id="prevBtn" title="Previous">←</button>
      <button class="icon-btn" id="nextBtn" title="Next">→</button>
    </div>
  </div>
  <div class="modal-body" id="modalBody"></div>
</div>

<div class=\"stat\"><div class=\"l\">Power</div><div class=\"v\">512 kW</div></div>\n      <div class=\"stat\"><div class=\"l\">Availability</div><div class=\"v\">Online</div></div>\n    </div>\n    <div class=\"col\">\n      <div class=\"col-t\">Operational view</div>\n      <div class=\"kpis\">\n        <div class=\"k\"><div class=\"v\">1,248</div><div class=\"l\">ASSETS</div></div>\n        <div class=\"k\"><div class=\"v\">98%</div><div class=\"l\">REPORTING</div></div>\n        <div class=\"k\"><div class=\"v\">99.6%</div><div class=\"l\">QUALITY</div></div>\n      </div>\n      <div class=\"chart\"><svg viewBox=\"0 0 300 130\" preserveAspectRatio=\"none\">\n        <path d=\"M4,50 C40,46 80,44 120,38 C160,32 200,26 240,22 C270,19 290,17 296,16\" fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2.2\"/>\n        <path d=\"M4,110 C40,102 80,94 120,84 C160,74 200,60 240,48 C270,40 290,34 296,30\" fill=\"none\" stroke=\"#2563EB\" stroke-width=\"2.2\"/>\n      </svg></div>\n    </div>\n  </div>\n</div>\n</body>\n</html>\n"},{"id":"i8","file":"g-21-unified-workspace.html","title":"Unified Grid Workspace","category":"Product","dims":{"w":1100,"h":660},"html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Unified Grid Workspace</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ol:#E4EAE5; }\n  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }\n  html,body{ background:#FFFFFF; }\n  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }\n  .win{ width:1100px; height:660px; background:#fff; border:1px solid var(--ol); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); position:relative; }\n  .chrome{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:7px; padding:0 14px; border-bottom:1px solid var(--ol); }\n  .dot{ width:11px; height:11px; border-radius:50%; } .dot.r{ background:#EF4444; } .dot.y{ background:#F59E0B; }\n\n  .grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:24px; position:relative; }\n  .panel{ border:1px solid var(--ol); border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:10px; }\n  .p-t{ font-size:14px; font-weight:800; }\n\n  .asset{ display:flex; align-items:center; gap:10px; border:1px solid var(--ol); border-radius:8px; padding:8px 10px; }\n  .asset .n{ font-size:12.5px; font-weight:700; flex:1; }\n  .asset .v{ font-size:12.5px; font-weight:700; color:var(--g); }\n\n  .map{ flex:1; border-radius:8px; overflow:hidden; background:var(--g-bg); }\n  .map svg{ width:100%; height:100%; display:block; }\n\n  .disp{ border:1px solid var(--ol); border-radius:8px; padding:12px; }\n  .disp .l{ font-size:10.5px; font-weight:700; color:var(--ink-60); }\n  .disp .v{ font-size:24px; font-weight:800; color:var(--g); }\n\n  .center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:150px; height:150px; border-radius:50%; background:#fff; border:3px solid var(--g); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:2; box-shadow:0 0 0 10px #fff; }\n  .center .n{ font-size:20px; font-weight:800; color:var(--g); }\n</style>\n</head>\n<body>\n<div class=\"win\">\n  <div class=\"grid\">\n    <div class=\"panel\">\n      <div class=\"p-t\">Connected assets</div>\n      <div class=\"asset\"><span class=\"n\">Battery</span><span class=\"v\">125.4 kWh</span></div>\n      <div class=\"asset\"><span class=\"n\">Solar</span><span class=\"v\">64.8 kWh</span></div>\n      <div class=\"asset\"><span class=\"n\">EV charger</span><span class=\"v\">32.0 kWh</span></div>\n      <div class=\"asset\"><span class=\"n\">Meter</span><span class=\"v\">18.6 kWh</span></div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"p-t\">Network planning</div>\n      <div class=\"map\"><svg viewBox=\"0 0 300 200\">\n        <g stroke=\"#16A34A\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M40 100 H260\"/><path d=\"M100 40 V160\"/><path d=\"M200 40 V160\"/></g>\n        <g fill=\"#16A34A\"><circle cx=\"100\" cy=\"100\" r=\"5\"/><circle cx=\"200\" cy=\"100\" r=\"5\"/></g>\n      </svg></div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"p-t\">kWh communications</div>\n      <div style=\"flex:1\"></div>\n    </div>\n    <div class=\"panel\">\n      <div class=\"p-t\">Grid services</div>\n      <div class=\"disp\"><div class=\"l\">Dispatch response</div><div class=\"v\">215 kW</div></div>\n      <div class=\"disp\"><div class=\"l\">Verified</div><div class=\"v\">✓</div></div>\n    </div>\n  </div>\n  <div class=\"center\"><div class=\"n\">kWh</div></div>\n</div>\n</body>\n</html>\n"},{"id":"i9","file":"g-19-competition-layered.html","title":"kWh Neutral Layer (corrected layout)","category":"Infrastructure","dims":{"w":1100,"h":660},"html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>kWh Neutral Layer — Corrected Layout</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#D7E2DA; }\n  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }\n  html,body{ background:#FFFFFF; }\n  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }\n  .win{ width:1100px; height:660px; background:#fff; border:1px solid var(--ol); border-radius:22px; padding:24px; }\n  svg{ width:100%; height:100%; display:block; }\n  text{ font-family:'DM Sans',sans-serif; }\n</style>\n</head>\n<body>\n<div class=\"win\">\n<svg viewBox=\"0 0 1100 610\">\n  <!-- connectors: top grid-service pills down to bar -->\n  <g stroke=\"#B9DEC7\" stroke-width=\"2\" stroke-dasharray=\"4 5\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <path d=\"M240 96 V520\"/>\n    <path d=\"M550 96 V520\"/>\n    <path d=\"M860 96 V520\"/>\n  </g>\n\n  <!-- top: grid services -->\n  <g>\n    <rect x=\"150\" y=\"40\" width=\"180\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#0B0F0C\" stroke-width=\"1.6\"/>\n    <text x=\"240\" y=\"71\" font-size=\"15\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\">DERMS / VPP</text>\n    <rect x=\"460\" y=\"40\" width=\"180\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#0B0F0C\" stroke-width=\"1.6\"/>\n    <text x=\"550\" y=\"71\" font-size=\"15\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\">NETWORK PLANNING</text>\n    <rect x=\"770\" y=\"40\" width=\"180\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#0B0F0C\" stroke-width=\"1.6\"/>\n    <text x=\"860\" y=\"71\" font-size=\"15\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\">GRID SERVICES</text>\n  </g>\n  <text x=\"550\" y=\"20\" font-size=\"12\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\" letter-spacing=\"1\">GRID APPLICATIONS</text>\n\n  <!-- left: DERs -->\n  <g font-size=\"12.5\" font-weight=\"700\" fill=\"#0B0F0C\">\n    <rect x=\"24\" y=\"140\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F3FAF5\" stroke=\"#16A34A\" stroke-width=\"1.6\"/>\n    <text x=\"99\" y=\"172\" text-anchor=\"middle\">BATTERY</text>\n    <rect x=\"24\" y=\"212\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F3FAF5\" stroke=\"#16A34A\" stroke-width=\"1.6\"/>\n    <text x=\"99\" y=\"244\" text-anchor=\"middle\">EV CHARGER</text>\n    <rect x=\"24\" y=\"284\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F3FAF5\" stroke=\"#16A34A\" stroke-width=\"1.6\"/>\n    <text x=\"99\" y=\"316\" text-anchor=\"middle\">INVERTER</text>\n    <rect x=\"24\" y=\"356\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F3FAF5\" stroke=\"#16A34A\" stroke-width=\"1.6\"/>\n    <text x=\"99\" y=\"388\" text-anchor=\"middle\">METER</text>\n    <rect x=\"24\" y=\"428\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F3FAF5\" stroke=\"#16A34A\" stroke-width=\"1.6\"/>\n    <text x=\"99\" y=\"460\" text-anchor=\"middle\">FLEXIBLE LOAD</text>\n  </g>\n  <text x=\"99\" y=\"120\" font-size=\"12\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\" letter-spacing=\"1\">DERs</text>\n  <g stroke=\"#16A34A\" stroke-width=\"2\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <path d=\"M174 168 H210 V532\"/>\n    <path d=\"M174 240 H260 V532\"/>\n    <path d=\"M174 312 H370 V532\"/>\n    <path d=\"M174 384 H700 V532\"/>\n    <path d=\"M174 456 H900 V532\"/>\n  </g>\n\n  <!-- right: utility / aggregator / OEM layers -->\n  <g font-size=\"12.5\" font-weight=\"700\" fill=\"#0B0F0C\">\n    <rect x=\"926\" y=\"140\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F8FAF8\" stroke=\"#0B0F0C\" stroke-width=\"1.4\"/>\n    <text x=\"1001\" y=\"164\" text-anchor=\"middle\">UTILITIES</text>\n    <text x=\"1001\" y=\"180\" font-size=\"10\" font-weight=\"500\" fill=\"#6B7280\" text-anchor=\"middle\">Enterprise gateways</text>\n    <rect x=\"926\" y=\"212\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F8FAF8\" stroke=\"#0B0F0C\" stroke-width=\"1.4\"/>\n    <text x=\"1001\" y=\"236\" text-anchor=\"middle\">AGGREGATORS</text>\n    <text x=\"1001\" y=\"252\" font-size=\"10\" font-weight=\"500\" fill=\"#6B7280\" text-anchor=\"middle\">Aggregation platforms</text>\n    <rect x=\"926\" y=\"284\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F8FAF8\" stroke=\"#0B0F0C\" stroke-width=\"1.4\"/>\n    <text x=\"1001\" y=\"308\" text-anchor=\"middle\">OEMs</text>\n    <text x=\"1001\" y=\"324\" font-size=\"10\" font-weight=\"500\" fill=\"#6B7280\" text-anchor=\"middle\">OEM clouds</text>\n    <rect x=\"926\" y=\"356\" width=\"150\" height=\"56\" rx=\"8\" fill=\"#F8FAF8\" stroke=\"#0B0F0C\" stroke-width=\"1.4\"/>\n    <text x=\"1001\" y=\"380\" text-anchor=\"middle\">APPLICATIONS</text>\n    <text x=\"1001\" y=\"396\" font-size=\"10\" font-weight=\"500\" fill=\"#6B7280\" text-anchor=\"middle\">Super-APIs</text>\n  </g>\n  <text x=\"1001\" y=\"120\" font-size=\"12\" font-weight=\"800\" fill=\"#0B0F0C\" text-anchor=\"middle\" letter-spacing=\"1\">UTILITIES + AGGREGATORS</text>\n  <g stroke=\"#0B0F0C\" stroke-width=\"1.6\" stroke-dasharray=\"3 4\" fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <path d=\"M926 168 H860 V532\"/>\n    <path d=\"M926 240 H760 V532\"/>\n    <path d=\"M926 312 H480 V532\"/>\n    <path d=\"M926 384 H300 V532\"/>\n  </g>\n\n  <!-- bottom: kWh neutral layer, foundation, nothing below -->\n  <rect x=\"24\" y=\"532\" width=\"1052\" height=\"66\" rx=\"10\" fill=\"#16A34A\"/>\n  <text x=\"52\" y=\"558\" font-size=\"17\" font-weight=\"800\" fill=\"#fff\">kWh</text>\n  <text x=\"52\" y=\"578\" font-size=\"12\" font-weight=\"600\" fill=\"#DCFCE7\">Neutral communications layer</text>\n  <g font-size=\"11\" font-weight=\"700\" fill=\"#fff\" text-anchor=\"middle\">\n    <text x=\"440\" y=\"558\">OEM-AGNOSTIC EDGE</text>\n    <text x=\"620\" y=\"558\">OPEN GRID STANDARDS</text>\n    <text x=\"810\" y=\"558\">OFFLINE LOCAL CONTROL</text>\n    <text x=\"1000\" y=\"558\">NEUTRAL OWNER LAYER</text>\n  </g>\n</svg>\n</div>\n</body>\n</html>\n"},{"id":"i10","file":"g-32-platform-architecture.html","title":"Grid Intelligence — Platform Architecture","category":"Infrastructure","dims":{"w":1600,"h":1400},"html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Platform Architecture</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{\n    --g:#16A34A; --g-dk:#075E31; --g-bg:#EAF7EE; --g-mid:#BBF7D0;\n    --ink:#0B0F0C; --ink-70:rgba(11,15,12,.7); --ink-55:rgba(11,15,12,.55); --ink-40:rgba(11,15,12,.4);\n    --ol:#E4EAE5; --sf:#F7F9F7; --y:#F7B719; --y-bg:#FEF6E4;\n  }\n  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }\n  html{ color-scheme:light; }\n  html,body{ background:#FFFFFF; }\n  body{ display:flex; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }\n\n  .slide{ width:1600px; background:#fff; color:var(--ink); padding:56px 64px 64px; }\n\n  .head{ margin-bottom:36px; }\n  .logo{ height:22px; }\n  .title{ font-size:42.5px; font-weight:800; margin-top:16px; line-height:1.15; max-width:1100px; text-wrap:balance; }\n  .underline{ width:120px; height:3px; background:var(--g); margin-top:14px; }\n  .sub{ font-size:17.5px; font-weight:600; color:var(--ink-55); margin-top:12px; max-width:800px; }\n  .tag{ display:inline-block; margin-top:16px; font-size:14px; font-weight:800; letter-spacing:.04em; color:var(--g); background:var(--g-bg); border-radius:99px; padding:6px 16px; }\n\n  .grid{ display:grid; grid-template-columns:150px 1fr; row-gap:28px; column-gap:24px; align-items:stretch; }\n  .rail{ display:flex; align-items:flex-start; padding-top:6px; }\n  .rail .n{ font-size:13px; font-weight:800; letter-spacing:.06em; color:var(--ink-40); line-height:1.5; }\n\n  /* row 1 — data sources */\n  .sources{ display:grid; grid-template-columns:repeat(7,1fr); gap:12px; }\n  .src{ border:1.5px solid var(--ol); border-radius:14px; padding:16px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }\n  .src svg{ width:20px; height:20px; color:var(--g); }\n  .src .t{ font-size:14px; font-weight:700; }\n  .arrow-down{ display:flex; justify-content:center; margin-top:2px; }\n  .arrow-down svg{ width:14px; height:14px; color:var(--ink-40); }\n  .arrows-row{ display:grid; grid-template-columns:repeat(7,1fr); }\n  .arrows-row > div{ display:flex; justify-content:center; }\n  .arrows-row svg{ width:14px; height:14px; color:var(--ink-40); }\n\n  /* row 2 — integration bar */\n  .layer-bar{ background:var(--g); border-radius:16px; padding:20px 26px; color:#fff; }\n  .layer-bar .t{ font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px; }\n  .layer-bar .t svg{ width:16px; height:16px; }\n  .layer-bar .s{ font-size:15px; font-weight:600; color:#DCFCE7; margin-top:6px; }\n\n  /* row 3 — grid intelligence container */\n  .platform{ border:1.5px solid var(--g-mid); background:var(--sf); border-radius:20px; padding:26px; }\n  .platform-t{ font-size:22.5px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:18px; }\n  .platform-t svg{ width:17px; height:17px; color:var(--g); }\n  .feat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }\n  .feat{ background:#fff; border:1px solid var(--ol); border-radius:14px; padding:18px 20px; }\n  .feat .t{ font-size:17px; font-weight:800; }\n  .feat .s{ font-size:14px; color:var(--ink-55); margin-top:8px; line-height:1.65; }\n  .feat.alerts{ position:relative; }\n  .flow-badge{ position:absolute; top:14px; right:16px; display:flex; align-items:center; gap:4px; font-size:11px; font-weight:800; color:#92600A; background:var(--y-bg); border-radius:99px; padding:3px 9px; }\n  .flow-badge svg{ width:10px; height:10px; }\n\n  .admin-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }\n  .admin{ background:#fff; border:1px solid var(--ol); border-radius:12px; padding:12px 14px; }\n  .admin .t{ font-size:14px; font-weight:800; }\n  .admin .s{ font-size:12.5px; color:var(--ink-55); margin-top:4px; }\n\n  .engine{ margin-top:14px; background:var(--g-dk); border-radius:14px; padding:16px 20px; color:#fff; display:flex; align-items:center; gap:10px; }\n  .engine svg{ width:16px; height:16px; flex-shrink:0; }\n  .engine .t{ font-size:15.5px; font-weight:800; }\n  .engine .s{ font-size:13.5px; color:#DCFCE7; margin-top:2px; }\n\n  /* row 4 — outputs */\n  .outputs{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }\n  .out{ border:1.5px solid var(--ol); border-radius:16px; padding:20px 22px; }\n  .out .t{ font-size:17.5px; font-weight:800; display:flex; align-items:center; justify-content:space-between; }\n  .out .s{ font-size:14px; color:var(--ink-55); margin-top:8px; line-height:1.6; }\n\n  /* row 5 — DISCOM GIS app (external system, black border not green) */\n  .external{ border:1.5px solid var(--ink); border-radius:20px; padding:24px 26px; }\n  .external-t{ font-size:20px; font-weight:800; }\n  .external-t .s2{ font-size:14px; font-weight:600; color:var(--ink-55); margin-left:8px; }\n  .external-s{ font-size:15px; color:var(--ink-55); margin-top:6px; }\n  .ext-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px; }\n  .ext{ background:var(--sf); border:1px solid var(--ol); border-radius:12px; padding:16px 18px; }\n  .ext .t{ font-size:15.5px; font-weight:800; }\n  .ext .s{ font-size:13.5px; color:var(--ink-55); margin-top:6px; }\n</style>\n</head>\n<body>\n<div class=\"slide\">\n\n  <div class=\"head\">\n    <img class=\"logo\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeAAAADYCAYAAAAzijDhAAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAB4KADAAQAAAABAAAA2AAAAADcWmGSAABAAElEQVR4Ae2dB3wcxfn3dSq23HuRq2Rc5F5ww0AAU8yfGicGTAstYGpChwAJBEJJo9e8oQRCIJSEFsD0boN7lbvlhnvvkqV7v89xe6xOV3bvtsydZj8f6e52Z2ee+U15Zp42OTn60ghoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI6AR0AhoBDQCGgGNgEZAI   .legend .item{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink-60); }\n</style>\n</head>\n<body>\n<div class=\"slide\">\n\n  <div class=\"title\">Choose your Layer 1 entry point, then expand capability step by step</div>\n  <div class=\"sub\">Started with DR communications interfaces, then expanded the stack over time.</div>\n  <div class=\"upfront-lbl\">Upfront<br><span style=\"font-weight:600;color:var(--ink-60);\">(Fixed + Variable)</span></div>\n\n  <svg class=\"connectors\" viewBox=\"0 0 1600 1050\">\n    <g fill=\"none\" stroke=\"#16A34A\" stroke-width=\"2.5\" stroke-dasharray=\"1 8\" stroke-linecap=\"round\">\n      <path d=\"M400 480 C 430 440, 410 420, 440 400\"/>\n      <path d=\"M780 400 C 810 360, 790 340, 820 320\"/>\n      <path d=\"M1160 320 C 1190 280, 1170 260, 1200 240\"/>\n    </g>\n    <g fill=\"#16A34A\">\n      <path d=\"M440 400 l -14 -3 l 3 -13 z\"/>\n      <path d=\"M820 320 l -14 -3 l 3 -13 z\"/>\n      <path d=\"M1200 240 l -14 -3 l 3 -13 z\"/>\n    </g>\n  </svg>\n\n  <!-- Box 1 — Layer 1 -->\n  <div class=\"box\" style=\"left:64px; top:270px; width:330px; height:620px;\">\n    <div class=\"box-body\">\n      <div class=\"box-h\"><div class=\"badge\">1</div><div><div class=\"t\">Layer 1</div><div class=\"s\">Choose one entry point</div></div></div>\n      <div class=\"hr\"></div>\n\n      <div class=\"sub-h\"><div class=\"badge2\">1A</div><div class=\"t\">Gateway / GKE</div></div>\n      <div class=\"li\">Utility GKE license: $150K one-time <span class=\"pill\">FIXED</span></div>\n      <div class=\"li\">Gateway: $200 / device <span class=\"pill\">VARIABLE</span></div>\n      <div class=\"li\">Customer license: $30 / endpoint <span class=\"pill\">VARIABLE</span></div>\n\n      <div class=\"or\">OR</div>\n\n      <div class=\"sub-h\"><div class=\"badge2\">1B</div><div class=\"t\">Integrations</div></div>\n      <div class=\"li\">5 OEM integrations: $125K one-time <span class=\"pill\">FIXED</spa eight:700; color:var(--ink-60); padding:0 16px 12px; border-bottom:1.5px solid var(--ink); }\n  td{ padding:20px 16px; border-bottom:1px solid var(--ol); vertical-align:top; }\n  tr:last-child td{ border-bottom:none; }\n  .tier{ font-size:20px; font-weight:800; letter-spacing:.02em; }\n  .tier-sub{ font-size:13px; font-weight:600; color:var(--ink-60); margin-top:4px; line-height:1.4; }\n  .calc{ font-size:14px; font-weight:600; color:var(--ink-60); line-height:1.55; }\n  .num{ font-size:28px; font-weight:800; color:var(--g); line-height:1; }\n  .num-sub{ font-size:13px; font-weight:600; color:var(--ink-60); margin-top:6px; }\n  .viz{ display:flex; flex-direction:column; align-items:center; justify-content:center; }\n  .viz svg{ width:520px; height:520px; display:block; }\n  .foot{ font-size:13px; font-weight:600; color:var(--ink-60); margin-top:8px; line-height:1.45; }\n</style>\n</head>\n<body>\n<div class=\"slide\">\n  <div class=\"eyebrow\">kWh Electric &middot; Market opportunity</div>\n  <div class=\"title\">TAM, SAM, SOM</div>\n  <div class=\"underline\"></div>\n  <div class=\"sub\">Primary markets: United States and Australia. Annual market size, not kWh take.</div>\n\n  <div class=\"body\">\n    <table>\n      <thead>\n        <tr>\n          <th>Tier</th>\n          <th>Build</th>\n          <th>Annual</th>\n        </tr>\n      </thead>\n      <tbody>\n        <tr>\n          <td>\n            <div class=\"tier\">TAM</div>\n            <div class=\"tier-sub\">All grid services + all communication infrastructure</div>\n          </td>\n          <td>\n            <div class=\"calc\">Global VPP $23.0B by 2033<br>+ global smart-grid comm $16.3B</div>\n          </td>\n          <td>\n            <div class=\"num\">$39.3B</div>\n            <div class=\"num-sub\">per year</div>\n          </td>\n        </tr>\n        <tr>\n          <td>\n            <div class=\"tier\">SAM</div>\n            <div class=\"tier-sub\">All comm infrastructure + all flexibility networks, US + Australia</div>\n          </td>\n          <td>\n            <div class=\"calc\">US+AU comm $5.5B<br>+ US+AU flexibility $4.0B</div>\n          </td>\n          <td>\n            <div class=\"num\">$9.5B</div>\n            <div class=\"num-sub\">per year</div>\n          </td>\n        </tr>\n        <tr>\n          <td>\n            <div class=\"tier\">SOM</div>\n            <div class=\"tier-sub\">5% of US + AU comm + 1% of US + AU flexibility</div>\n          </td>\n          <td>\n            <div class=\"calc\">5% &times; $5.5B = $275M<br>+ 1% &times; $4.0B = $40M</div>\n          </td>\n          <td>\n            <div class=\"num\">$315M</div>\n            <div class=\"num-sub\">per year</div>\n          </td>\n        </tr>\n      </tbody>\n    </table>\n\n    <div class=\"viz\">\n      <svg viewBox=\"0 0 520 520\" aria-label=\"TAM SAM SOM concentric circles\">\n        <circle cx=\"260\" cy=\"260\" r=\"248\" fill=\"var(--g-bg)\" stroke=\"var(--g)\" stroke-width=\"2\"/>\n        <circle cx=\"260\" cy=\"260\" r=\"168\" fill=\"var(--g-3)\" stroke=\"var(--g)\" stroke-width=\"2\"/>\n        <circle cx=\"260\" cy=\"260\" r=\"86\" fill=\"var(--g)\"/>\n\n        <text x=\"260\" y=\"54\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"15\" font-weight=\"800\" fill=\"#0B0F0C\">TAM</text>\n        <text x=\"260\" y=\"80\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"28\" font-weight=\"800\" fill=\"#16A34A\">$39.3B</text>\n\n        <text x=\"260\" y=\"140\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"15\" font-weight=\"800\" fill=\"#0B0F0C\">SAM</text>\n        <text x=\"260\" y=\"166\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"26\" font-weight=\"800\" fill=\"#0B0F0C\">$9.5B</text>\n\n        <text x=\"260\" y=\"250\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"14\" font-weight=\"800\" fill=\"#FFFFFF\">SOM</text>\n        <text x=\"260\" y=\"280\" text-anchor=\"middle\" font-family=\"DM Sans, sans-serif\" font-size=\"26\" font-weight=\"800\" fill=\"#FFFFFF\">$315M</text>\n      </svg>\n    </div>\n  </div>\n\n  <div class=\"foot\">Comm is the published smart-grid communications market (TBRC $16.3B global, 2026): US $4.9B + Australia $0.6B = $5.5B. Flexibility is US+AU demand-response / VPP programs: US $3.6B + Australia $0.4B = $4.0B. Grid services in TAM is the $23B global VPP figure already on the materials. These are industry markets, not kWh&rsquo;s $9/endpoint take. Circles are nested for reading, not area-scaled.</div>\n</div>\n</body>\n</html>\n"},{"id":"i37","file":"g-29-bottom-up-calculation.html","title":"Bottom-Up Endpoints (US + Australia)","category":"Finance","dims":{"w":520,"h":720},"html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Bottom-up endpoints — US + Australia</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ink-40:rgba(11,15,12,.4); --ol:#E4EAE5; }\n  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }\n  html{ color-scheme:light; }\n  html,body{ background:#FFFFFF; }\n  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }\n  .win{ width:520px; background:#fff; border:1.5px solid var(--ol); border-radius:22px; padding:26px; color:var(--ink); }\n  .h{ font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--ink-60); margin-bottom:16px; }\n  .row{ display:flex; align-items:center; gap:14px; padding:11px 0; }\n  .ic{ width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--g); }\n  .ic "neg\">($4.19)</td></tr><tr class=\"total highlight stripe\"><td>Net contribution / device</td><td class=\"neg\">($27.27)</td><td class=\"neg\">($12.42)</td><td class=\"neg\">($3.73)</td><td class=\"pos\">+$0.52</td></tr></tbody></table>\n  </div>\n\n</div>\n</body>\n</html>\n"}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items;
const CATEGORIES = [...new Set(ITEMS.map(i => i.category))];

let activeCategory = 'All';
let currentIndex = 0;
let currentList = ITEMS;

function thumbScale(preset, boxW, boxH){
  return Math.min(boxW / preset.w, boxH / preset.h);
}

function renderFilters(){
  const el = document.getElementById('filters');
  const all = [['All', ITEMS.length], ...CATEGORIES.map(c => [c, ITEMS.filter(i=>i.category===c).length])];
  el.innerHTML = all.map(([c,n]) =>
    `<button class="chip ${c===activeCategory?'on':''}" data-cat="${c}">${c}<span class="n">${n}</span></button>`
  ).join('');
  el.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; renderGrid(); renderFilters(); window.scrollTo({top:0}); });
  });
}

function renderGrid(){
  const main = document.getElementById('main');
  const cats = activeCategory === 'All' ? CATEGORIES : [activeCategory];
  main.innerHTML = cats.map(cat => {
    const list = ITEMS.filter(i => i.category === cat);
    if(!list.length) return '';
    const cards = list.map(item => {
      const p = item.dims;
      const scale = thumbScale(p, 224, 150);
      return `<div class="card" data-id="${item.id}">
        <div class="thumb"><iframe srcdoc="${item.html.replace(/"/g,'&quot;')}" style="width:${p.w}px;height:${p.h}px;transform:scale(${scale});" scrolling="no" tabindex="-1"></iframe></div>
        <div class="card-foot"><div class="card-title">${item.title}</div><div class="card-tag">${item.category}</div></div>
      </div>`;
    }).join('');
    return `<section class="cat"><h2>${cat} <span class="n">${list.length}</span></h2><div class="grid">${cards}</div></section>`;
  }).join('') || '<div class="empty">Nothing here yet.</div>';

  main.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(card.dataset.id));
  });
}

function openModal(id){
  currentList = activeCategory === 'All' ? ITEMS : ITEMS.filter(i => i.category === activeCategory);
  currentIndex = currentList.findIndex(i => i.id === id);
  showCurrent();
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function showCurrent(){
  const item = currentList[currentIndex];
  const p = item.dims;
  document.getElementById('modalTitle').textContent = item.title + ' — ' + item.category + '  ·  ' + (currentIndex+1) + ' / ' + currentList.length;
  const body = document.getElementById('modalBody');
  const maxW = window.innerWidth - 120;
  const maxH = window.innerHeight - 160;
  const scale = Math.min(1.4, maxW / p.w, maxH / p.h);
  body.innerHTML = `<iframe srcdoc="${item.html.replace(/"/g,'&quot;')}" style="width:${p.w}px;height:${p.h}px;transform:scale(${scale});transform-origin:top center;"></iframe>`;
}

document.getElementById('prevBtn').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + currentList.length) % currentList.length; showCurrent();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % currentList.length; showCurrent();
});
document.getElementById('closeBtn').addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  const modal = document.getElementById('modal');
  if(!modal.classList.contains('open')) return;
  if(e.key === 'Escape') closeModal();
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
});

renderFilters();
renderGrid();
</script>

</body>
</html>
