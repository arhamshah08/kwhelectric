<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Revenue Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#EDEFED; }
  body{ display:flex; align-items:center; justify-content:center; padding:40px; font-family:'DM Sans',sans-serif; }
  .win{ width:620px; background:#fff; border:1px solid var(--ol); border-radius:10px; padding:22px; display:flex; gap:14px; color:var(--ink); }
  .card{ flex:1; text-align:center; border:1px solid var(--ol); border-radius:8px; padding:20px 10px; }
  .v{ font-size:38px; font-weight:800; color:var(--g); }
  .l{ font-size:12px; font-weight:700; color:rgba(11,15,12,.6); margin-top:4px; }
</style>
</head>
<body>
<div class="win">
  <div class="card"><div class="v">$177</div><div class="l">7-year revenue</div></div>
  <div class="card"><div class="v">$147</div><div class="l">recurring</div></div>
  <div class="card"><div class="v">83%</div><div class="l">recurring mix</div></div>
</div>
</body>
</html>
