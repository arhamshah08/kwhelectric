<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team — Product</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#EDEFED; }
  body{ display:flex; align-items:center; justify-content:center; padding:40px; font-family:'DM Sans',sans-serif; }
  .card{ width:300px; height:180px; background:#fff; border:1px solid var(--ol); border-radius:10px; padding:16px; display:flex; gap:14px; }
  .side{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .logo{ display:flex; align-items:center; gap:5px; font-weight:700; font-size:12px; }
  .logo svg{ width:12px; height:12px; color:var(--g); }
  .chart{ flex:1; }
  .chart svg{ width:100%; height:100%; display:block; }
  .list{ flex:1; display:flex; flex-direction:column; gap:8px; justify-content:center; }
  .row{ display:flex; align-items:center; gap:6px; }
  .row .bar{ flex:1; height:5px; border-radius:99px; background:#EEF3EF; }
  .row .bar .fill{ height:100%; border-radius:99px; background:var(--ol); }
  .row .ok{ width:14px; height:14px; border-radius:50%; background:var(--g); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .row .ok svg{ width:8px; height:8px; color:#fff; }
</style>
</head>
<body>
<div class="card">
  <div class="side">
    <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-13h-7l0-7z"/></svg>kWh</div>
    <div class="chart">
      <svg viewBox="0 0 120 70" preserveAspectRatio="none">
        <path d="M4,58 L24,44 L44,50 L64,26 L84,32 L100,12" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="4" cy="58" r="2.4" fill="#16A34A"/><circle cx="24" cy="44" r="2.4" fill="#16A34A"/>
        <circle cx="44" cy="50" r="2.4" fill="#16A34A"/><circle cx="64" cy="26" r="2.4" fill="#16A34A"/>
        <circle cx="84" cy="32" r="2.4" fill="#16A34A"/><circle cx="100" cy="12" r="2.8" fill="#16A34A"/>
      </svg>
    </div>
  </div>
  <div class="list">
    <div class="row"><span class="bar"><span class="fill" style="width:70%"></span></span><span class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span></div>
    <div class="row"><span class="bar"><span class="fill" style="width:45%"></span></span></div>
    <div class="row"><span class="bar"><span class="fill" style="width:85%"></span></span></div>
    <div class="row"><span class="bar"><span class="fill" style="width:35%"></span></span></div>
  </div>
</div>
</body>
</html>
