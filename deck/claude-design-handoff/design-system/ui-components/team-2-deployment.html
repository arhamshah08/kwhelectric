<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team — Deployment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#EDEFED; }
  body{ display:flex; align-items:center; justify-content:center; padding:40px; font-family:'DM Sans',sans-serif; }
  .card{ width:300px; height:180px; background:#fff; border:1px solid var(--ol); border-radius:10px; padding:16px; display:flex; gap:14px; }
  .map{ flex:1; border:1px solid var(--ol); border-radius:6px; position:relative; }
  .map svg{ width:100%; height:100%; display:block; }
  .steps{ flex:1; display:flex; flex-direction:column; gap:10px; justify-content:center; }
  .step{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--ink); }
  .step .dot{ width:14px; height:14px; border-radius:50%; background:var(--g); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .step .dot svg{ width:8px; height:8px; color:#fff; }
  .step.live .dot{ background:#16A34A; }
  .step.live .dot::after{ content:""; }
</style>
</head>
<body>
<div class="card">
  <div class="map">
    <svg viewBox="0 0 100 120">
      <path d="M50 6 L70 20 L74 40 L64 60 L70 80 L58 108 L44 108 L34 84 L28 60 L18 42 L24 20 Z" fill="none" stroke="#0B0F0C" stroke-width="1.6"/>
      <circle cx="45" cy="30" r="3" fill="#16A34A"/>
      <circle cx="52" cy="55" r="3" fill="#16A34A"/>
      <circle cx="40" cy="80" r="3" fill="#16A34A"/>
      <circle cx="55" cy="95" r="3.4" fill="#16A34A"/>
    </svg>
  </div>
  <div class="steps">
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Site assessment</div>
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Installation</div>
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Commissioning</div>
    <div class="step live"><span class="dot"></span>Live</div>
  </div>
</div>
</body>
</html>
