<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#EDEFED; }
  body{ display:flex; align-items:center; justify-content:center; padding:40px; font-family:'DM Sans',sans-serif; }
  .win{ width:420px; background:#fff; border:1px solid var(--ol); border-radius:10px; padding:22px; display:flex; flex-direction:column; gap:14px; color:var(--ink); }
  .h{ font-size:14px; font-weight:800; }
  .card{ border:1px solid var(--ol); border-radius:8px; padding:16px; }
  .l{ font-size:13px; font-weight:700; color:rgba(11,15,12,.6); }
  .v{ font-size:32px; font-weight:800; margin-top:4px; }
  .v .u{ font-size:14px; font-weight:700; }
  .sub{ font-size:13px; color:rgba(11,15,12,.5); margin-top:2px; }
</style>
</head>
<body>
<div class="win">
  <div class="h">Access paths</div>
  <div class="card"><div class="l">Certified software</div><div class="v">$30</div></div>
  <div class="card"><div class="l">Legacy gateway</div><div class="v">$199 <span class="u">list</span></div><div class="sub">$65 landed COGS</div></div>
</div>
</body>
</html>
