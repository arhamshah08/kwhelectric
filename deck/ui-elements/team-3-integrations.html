<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team — Integrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .card{ width:300px; height:180px; background:#fff; border:1px solid var(--ol); border-radius:22px; padding:16px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:10px; }
  .tile{ border:1px solid var(--ol); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:9.5px; font-weight:700; color:var(--ink); text-align:center; }
  .tile svg{ width:20px; height:20px; }
  .tile.api{ align-items:flex-start; padding:10px; justify-content:flex-start; gap:4px; }
  .api-line{ width:80%; height:3px; background:#EEF3EF; border-radius:2px; }
  .api-dot{ width:5px; height:5px; border-radius:50%; background:var(--g); }
</style>
</head>
<body>
<div class="card">
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6z"/></svg>DISCOM / UTILITY</div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>DERMS / EMS</div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="18" r="1"/></svg>SMART METERS</div>
  <div class="tile api">
    <div style="font-size:9px;font-weight:700;">API</div>
    <div class="api-line"></div>
    <div style="display:flex;align-items:center;gap:4px;"><span class="api-dot"></span><span class="api-line" style="width:60%"></span></div>
    <div style="display:flex;align-items:center;gap:4px;"><span class="api-dot"></span><span class="api-line" style="width:70%"></span></div>
  </div>
</div>
</body>
</html>
