<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workflow — Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html{ color-scheme:light; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .win{ width:360px; height:640px; background:#fff; border:1px solid var(--ol); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); }
  .head{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 12px; border-bottom:1px solid var(--ol); }
  .h-t{ font-size:19px; font-weight:800; }
  .h-a{ font-size:13px; font-weight:700; color:var(--g); }
  .body{ flex:1; padding:16px 18px; overflow:hidden; display:flex; flex-direction:column; gap:12px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field .l{ font-size:12px; font-weight:700; color:var(--ink-60); }
  .field .v{ font-size:15px; font-weight:600; border:1px solid var(--ol); border-radius:7px; padding:7px 10px; }
  .section-l{ font-size:12px; font-weight:800; color:var(--ink-60); letter-spacing:.04em; margin-top:4px; }
  .row2{ display:flex; gap:8px; }
  .row2 .field{ flex:1; }
  .foot{ display:flex; gap:8px; padding:14px 18px; border-top:1px solid var(--ol); }
  .btn{ flex:1; text-align:center; font-size:15px; font-weight:700; padding:10px; border-radius:8px; }
  .btn.cancel{ border:1px solid var(--ol); color:var(--ink); }
  .btn.save{ background:var(--g); color:#fff; }
</style>
</head>
<body>
<div class="win">
  <div class="head"><div class="h-t">Program</div><div class="h-a">Create program</div></div>
  <div class="body">
    <div class="field"><div class="l">Program name</div><div class="v">Summer Flex 25</div></div>
    <div class="row2">
      <div class="field"><div class="l">Type</div><div class="v">Economic</div></div>
      <div class="field"><div class="l">Objective</div><div class="v">Capacity</div></div>
    </div>
    <div class="field"><div class="l">Policy</div><div class="v">Default DR Policy</div></div>
    <div class="field"><div class="l">Performance window</div><div class="v">Jun 1 – Aug 31, 2025</div></div>
    <div class="section-l">DISPATCH RULES</div>
    <div class="row2">
      <div class="field"><div class="l">Min duration</div><div class="v">30 min</div></div>
      <div class="field"><div class="l">Min notice</div><div class="v">15 min</div></div>
    </div>
    <div class="row2">
      <div class="field"><div class="l">Max events / day</div><div class="v">2</div></div>
      <div class="field"><div class="l">Ramp rate</div><div class="v">100% / 5 min</div></div>
    </div>
  </div>
  <div class="foot"><div class="btn cancel">Cancel</div><div class="btn save">Save program</div></div>
</div>
</body>
</html>
