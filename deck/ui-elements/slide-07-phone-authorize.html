<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 07 — Phone: Authorize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ink-35:rgba(11,15,12,.28); --ol:rgba(11,15,12,.1); }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }

  .phone{ width:280px; height:570px; border:3px solid var(--ink); border-radius:34px; padding:9px; background:#fff; position:relative; }
  .notch{ width:54px; height:5px; border-radius:99px; background:var(--ink); margin:2px auto 8px; }
  .screen{ width:100%; height:calc(100% - 24px); border-radius:22px; display:flex; flex-direction:column; padding:18px 16px; }

  .title{ font-size:15.5px; font-weight:700; line-height:1.3; }
  .desc{ font-size:12.5px; color:var(--ink-60); line-height:1.4; margin-top:6px; }

  .perm{ margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .perm-row{ display:flex; align-items:center; gap:10px; }
  .perm-row .ic{ width:28px; height:28px; border-radius:8px; background:var(--g-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .perm-row .ic svg{ width:15px; height:15px; color:var(--g); }
  .perm-row .txt{ flex:1; min-width:0; }
  .perm-row .name{ font-size:13.5px; font-weight:700; }
  .perm-row .sub{ font-size:11px; color:var(--ink-60); margin-top:1px; }

  .toggle{ width:32px; height:18px; border-radius:99px; background:var(--g); position:relative; flex-shrink:0; }
  .toggle .knob{ width:14px; height:14px; border-radius:50%; background:#fff; position:absolute; top:2px; right:2px; }

  .authorize-btn{ margin-top:auto; background:var(--g); color:#fff; text-align:center; font-size:15px; font-weight:700; border-radius:22px; padding:11px; }
  .cancel{ text-align:center; font-size:13px; font-weight:600; color:var(--ink-60); margin-top:9px; }

  .revoke{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; font-weight:600; color:var(--g); margin-top:10px; }
  .revoke svg{ width:11px; height:11px; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="title">Share data with kWh Electric</div>
    <div class="desc">Allow kWh Electric to securely access your asset data.</div>

    <div class="perm">
      <div class="perm-row">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V12M11 20V4M18 20v-8"/></svg></div>
        <div class="txt"><div class="name">Telemetry</div><div class="sub">Real-time performance</div></div>
        <div class="toggle"><div class="knob"></div></div>
      </div>
      <div class="perm-row">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
        <div class="txt"><div class="name">Status &amp; Events</div><div class="sub">Operations and alerts</div></div>
        <div class="toggle"><div class="knob"></div></div>
      </div>
      <div class="perm-row">
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 6h6M9 18h.01"/></svg></div>
        <div class="txt"><div class="name">Device Info</div><div class="sub">Model and configuration</div></div>
        <div class="toggle"><div class="knob"></div></div>
      </div>
    </div>

    <div class="authorize-btn">Authorize</div>
    <div class="cancel">Cancel</div>
    <div class="revoke">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>
      You can revoke access anytime.
    </div>
  </div>
</div>

</body>
</html>
