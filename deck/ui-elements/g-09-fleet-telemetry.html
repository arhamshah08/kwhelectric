<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fleet Telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ol:#E4EAE5; --blue:#2563EB; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .win{ width:1084px; height:560px; background:#fff; border:1px solid var(--ol); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); }
  .chrome{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:7px; padding:0 14px; border-bottom:1px solid var(--ol); }
  .dot{ width:11px; height:11px; border-radius:50%; } .dot.r{ background:#EF4444; } .dot.y{ background:#F59E0B; }
  .cols{ flex:1; display:grid; grid-template-columns:1fr 1fr 1.3fr; gap:0; }
  .col{ padding:20px; display:flex; flex-direction:column; gap:12px; border-right:1px solid var(--ol); }
  .col:last-child{ border-right:none; }
  .col-t{ font-size:15px; font-weight:800; }
  .stat{ border:1px solid var(--ol); border-radius:8px; padding:12px 14px; }
  .stat .l{ font-size:11px; font-weight:700; color:var(--ink-60); }
  .stat .v{ font-size:22px; font-weight:800; margin-top:2px; }
  .stat .v.g{ color:var(--g); }
  .kpis{ display:flex; gap:8px; flex-wrap:wrap; }
  .kpis .k{ flex:1; min-width:70px; border:1px solid var(--ol); border-radius:8px; padding:10px; }
  .kpis .k .v{ font-size:17px; font-weight:800; }
  .kpis .k .l{ font-size:9.5px; font-weight:700; color:var(--ink-60); }
  .chart{ flex:1; border:1px solid var(--ol); border-radius:8px; padding:12px; }
  .chart svg{ width:100%; height:100%; display:block; }
</style>
</head>
<body>
<div class="win">
  <div class="cols">
    <div class="col">
      <div class="col-t">Raw device stream</div>
      <div class="stat"><div class="l">battery_soc</div><div class="v g">78%</div></div>
      <div class="stat"><div class="l">active_power</div><div class="v g">512 kW</div></div>
      <div class="stat"><div class="l">device_status</div><div class="v g">Online</div></div>
    </div>
    <div class="col">
      <div class="col-t">Normalized model</div>
      <div class="stat"><div class="l">State of charge</div><div class="v">78%</div></div>
      <div class="stat"><div class="l">Power</div><div class="v">512 kW</div></div>
      <div class="stat"><div class="l">Availability</div><div class="v">Online</div></div>
    </div>
    <div class="col">
      <div class="col-t">Operational view</div>
      <div class="kpis">
        <div class="k"><div class="v">1,248</div><div class="l">ASSETS</div></div>
        <div class="k"><div class="v">98%</div><div class="l">REPORTING</div></div>
        <div class="k"><div class="v">99.6%</div><div class="l">QUALITY</div></div>
      </div>
      <div class="chart"><svg viewBox="0 0 300 130" preserveAspectRatio="none">
        <path d="M4,50 C40,46 80,44 120,38 C160,32 200,26 240,22 C270,19 290,17 296,16" fill="none" stroke="#16A34A" stroke-width="2.2"/>
        <path d="M4,110 C40,102 80,94 120,84 C160,74 200,60 240,48 C270,40 290,34 296,30" fill="none" stroke="#2563EB" stroke-width="2.2"/>
      </svg></div>
    </div>
  </div>
</div>
</body>
</html>
