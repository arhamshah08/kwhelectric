<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Financial Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .win{ width:640px; background:#fff; border:1px solid var(--ol); border-radius:22px; padding:22px; display:flex; gap:14px; color:var(--ink); }
  .card{ flex:1; text-align:center; border:1px solid var(--ol); border-radius:8px; padding:20px 10px; }
  .v{ font-size:34px; font-weight:800; color:var(--g); }
  .l{ font-size:12px; font-weight:700; color:rgba(11,15,12,.6); margin-top:4px; }
</style>
</head>
<body>
<div class="win">
  <div class="card"><div class="v">Year 3</div><div class="l">EBITDA break-even</div></div>
  <div class="card"><div class="v">84%</div><div class="l">gross margin, year 5</div></div>
  <div class="card"><div class="v">$4–6M</div><div class="l">capital required</div></div>
</div>
</body>
</html>
