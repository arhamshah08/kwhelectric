<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team — Deployment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .card{ width:300px; height:180px; background:#fff; border:1px solid var(--ol); border-radius:22px; padding:16px; display:flex; gap:14px; }
  .map{ flex:1; border-radius:8px; background:var(--g-bg); position:relative; overflow:hidden; }
  .map svg{ width:100%; height:100%; display:block; }
  .steps{ flex:1; display:flex; flex-direction:column; gap:10px; justify-content:center; }
  .step{ display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; color:var(--ink); }
  .step .dot{ width:14px; height:14px; border-radius:50%; background:var(--g); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .step .dot svg{ width:8px; height:8px; color:#fff; }
</style>
</head>
<body>
<div class="card">
  <div class="map">
    <svg viewBox="0 0 120 120">
      <g stroke="#BBF7D0" stroke-width="1.4" fill="none">
        <path d="M0 40 H120 M0 78 H120 M30 0 V120 M86 0 V120"/>
      </g>
      <g stroke="#16A34A" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M30 40 H86"/>
        <path d="M58 40 V78"/>
      </g>
      <circle cx="30" cy="40" r="4" fill="#16A34A"/>
      <circle cx="58" cy="40" r="4" fill="#16A34A"/>
      <circle cx="86" cy="40" r="4" fill="#16A34A"/>
      <circle cx="58" cy="78" r="5" fill="#16A34A" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>
  <div class="steps">
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Site assessment</div>
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Installation</div>
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Commissioning</div>
    <div class="step"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>Live</div>
  </div>
</div>
</body>
</html>
