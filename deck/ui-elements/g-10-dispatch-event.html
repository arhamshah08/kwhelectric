<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatch Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ol:#E4EAE5; --amber:#D97706; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .win{ width:1084px; height:560px; background:#fff; border:1px solid var(--ol); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); }
  .chrome{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:7px; padding:0 14px; border-bottom:1px solid var(--ol); }
  .dot{ width:11px; height:11px; border-radius:50%; } .dot.r{ background:#EF4444; } .dot.y{ background:#F59E0B; }
  .content{ flex:1; padding:26px 30px; display:flex; flex-direction:column; gap:18px; min-height:0; }

  .top{ display:flex; align-items:center; justify-content:space-between; }
  .t{ font-size:27px; font-weight:800; }
  .metrics{ display:flex; gap:44px; }
  .m .l{ font-size:10.5px; font-weight:700; color:var(--ink-60); }
  .m .v{ font-size:19px; font-weight:800; margin-top:2px; }

  .steps{ display:flex; gap:10px; }
  .step{ flex:1; border:1px solid var(--ol); border-radius:8px; padding:12px 14px; display:flex; align-items:center; gap:9px; }
  .step .n{ width:21px; height:21px; border-radius:50%; background:var(--g-bg); color:var(--g); font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .step .t2{ font-size:12.5px; font-weight:700; }
  .step.active .n{ background:#FEF3C7; color:var(--amber); }

  .chart{ flex:1; border:1px solid var(--ol); border-radius:8px; padding:20px 24px; display:flex; flex-direction:column; min-height:0; }
  .chart-head{ display:flex; align-items:center; justify-content:space-between; }
  .chart-t{ font-size:15px; font-weight:800; }
  .legend{ display:flex; gap:16px; }
  .legend span{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--ink-60); }
  .legend .sw{ width:12px; height:3px; border-radius:2px; }
  .chart-body{ flex:1; min-height:0; margin-top:10px; }
  .chart-body svg{ width:100%; height:100%; display:block; }
  .axis{ display:flex; justify-content:space-between; margin-top:4px; }
  .axis span{ font-size:10.5px; color:var(--ink-60); }

  .bottom{ display:flex; gap:24px; }
  .b{ flex:1; text-align:center; border:1px solid var(--ol); border-radius:8px; padding:12px; }
  .b .v{ font-size:21px; font-weight:800; }
  .b .l{ font-size:10.5px; font-weight:700; color:var(--ink-60); margin-top:2px; }
</style>
</head>
<body>
<div class="win">
  <div class="content">
    <div class="top">
      <div class="t">Dispatch Event</div>
      <div class="metrics">
        <div class="m"><div class="l">Target</div><div class="v">250 kW</div></div>
        <div class="m"><div class="l">Window</div><div class="v">12:00 – 12:30</div></div>
        <div class="m"><div class="l">Fleet</div><div class="v">1,248 assets</div></div>
      </div>
    </div>
    <div class="steps">
      <div class="step"><span class="n">1</span><span class="t2">Policy check — Passed</span></div>
      <div class="step active"><span class="n">2</span><span class="t2">Edge execution — Active</span></div>
      <div class="step"><span class="n">3</span><span class="t2">Acknowledgement</span></div>
      <div class="step"><span class="n">4</span><span class="t2">Evidence package</span></div>
    </div>
    <div class="chart">
      <div class="chart-head">
        <div class="chart-t">Actual response</div>
        <div class="legend">
          <span><span class="sw" style="background:#D97706"></span>Target</span>
          <span><span class="sw" style="background:#16A34A"></span>Actual</span>
        </div>
      </div>
      <div class="chart-body">
        <svg viewBox="0 0 900 200" preserveAspectRatio="none">
          <line x1="0" y1="180" x2="900" y2="180" stroke="#E4EAE5"/>
          <line x1="0" y1="90" x2="900" y2="90" stroke="#E4EAE5" stroke-dasharray="2 4"/>
          <rect x="260" y="14" width="380" height="166" fill="#EAF7EE"/>
          <path d="M20,170 L260,170 L260,40 L640,40 L640,170 L880,170"
                fill="none" stroke="#D97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M20,176 C120,172 200,166 260,158 C320,90 380,50 460,46 C540,46 600,86 640,128 C700,158 800,172 880,176"
                fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="axis"><span>11:40</span><span>11:50</span><span>12:00</span><span>12:10</span><span>12:20</span><span>12:30</span><span>12:40</span></div>
    </div>
    <div class="bottom">
      <div class="b"><div class="v">30 min</div><div class="l">DURATION</div></div>
      <div class="b"><div class="v">247 kW</div><div class="l">PEAK</div></div>
      <div class="b"><div class="v">241 kW</div><div class="l">AVERAGE</div></div>
      <div class="b"><div class="v" style="color:var(--g)">96.4%</div><div class="l">ACCURACY</div></div>
    </div>
  </div>
</div>
</body>
</html>
