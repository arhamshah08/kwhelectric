<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slide 07 — Phone: Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ink-35:rgba(11,15,12,.28); --ol:rgba(11,15,12,.1); }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }

  /* identical frame to authorize screen */
  .phone{ width:280px; height:570px; border:3px solid var(--ink); border-radius:34px; padding:9px; background:#fff; position:relative; }
  .notch{ width:54px; height:5px; border-radius:99px; background:var(--ink); margin:2px auto 8px; }
  .screen{ width:100%; height:calc(100% - 24px); border-radius:22px; display:flex; flex-direction:column; padding:18px 16px; }

  .title{ font-size:15.5px; font-weight:700; }

  .opt-list{ margin-top:18px; display:flex; flex-direction:column; gap:10px; }
  .opt{ border:1px solid var(--ol); border-radius:12px; padding:12px; display:flex; align-items:center; gap:12px; }
  .opt.on{ border-color:var(--g); background:var(--g-bg); }
  .radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--ink-35); flex-shrink:0; position:relative; }
  .opt.on .radio{ border-color:var(--g); }
  .opt.on .radio::after{ content:""; width:9px; height:9px; border-radius:50%; background:var(--g); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); }
  .opt .ic{ width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .opt .ic svg{ width:20px; height:20px; color:var(--ink); }
  .opt.on .ic svg{ color:var(--g); }
  .opt .txt{ flex:1; min-width:0; }
  .opt .name{ font-size:13.5px; font-weight:700; }
  .opt .sub{ font-size:11px; color:var(--ink-60); margin-top:1px; }

  .join-btn{ margin-top:auto; background:var(--g); color:#fff; text-align:center; font-size:15px; font-weight:700; border-radius:22px; padding:11px; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="title">Join a program</div>

    <div class="opt-list">
      <div class="opt on">
        <div class="radio"></div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M11 20V4M18 20v-7"/></svg></div>
        <div class="txt"><div class="name">Peak Savings Program</div><div class="sub">Your Utility</div></div>
      </div>
      <div class="opt">
        <div class="radio"></div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="12" height="16" rx="1.5"/><path d="M15 9h3l3 3v6h-2"/><circle cx="7.5" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/></svg></div>
        <div class="txt"><div class="name">EV Smart Charge</div><div class="sub">Your Utility</div></div>
      </div>
      <div class="opt">
        <div class="radio"></div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M13 8 10 13h3l-2 4"/></svg></div>
        <div class="txt"><div class="name">Home Battery Rewards</div><div class="sub">OEM Program</div></div>
      </div>
    </div>

    <div class="join-btn">Join program</div>
  </div>
</div>

</body>
</html>
