<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unified Grid Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --g:#16A34A; --g-bg:#EAF7EE; --ink:#0B0F0C; --ink-60:rgba(11,15,12,.6); --ol:#E4EAE5; }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#FFFFFF; }
  body{ display:flex; align-items:center; justify-content:center; padding:0; font-family:'DM Sans',sans-serif; }
  .win{ width:1100px; height:660px; background:#fff; border:1px solid var(--ol); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; color:var(--ink); position:relative; }
  .chrome{ height:34px; flex-shrink:0; display:flex; align-items:center; gap:7px; padding:0 14px; border-bottom:1px solid var(--ol); }
  .dot{ width:11px; height:11px; border-radius:50%; } .dot.r{ background:#EF4444; } .dot.y{ background:#F59E0B; }

  .grid{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:24px; position:relative; }
  .panel{ border:1px solid var(--ol); border-radius:22px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .p-t{ font-size:14px; font-weight:800; }

  .asset{ display:flex; align-items:center; gap:10px; border:1px solid var(--ol); border-radius:8px; padding:8px 10px; }
  .asset .n{ font-size:12.5px; font-weight:700; flex:1; }
  .asset .v{ font-size:12.5px; font-weight:700; color:var(--g); }

  .map{ flex:1; border-radius:8px; overflow:hidden; background:var(--g-bg); }
  .map svg{ width:100%; height:100%; display:block; }

  .disp{ border:1px solid var(--ol); border-radius:8px; padding:12px; }
  .disp .l{ font-size:10.5px; font-weight:700; color:var(--ink-60); }
  .disp .v{ font-size:24px; font-weight:800; color:var(--g); }

  .center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:150px; height:150px; border-radius:50%; background:#fff; border:3px solid var(--g); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:2; box-shadow:0 0 0 10px #fff; }
  .center .n{ font-size:20px; font-weight:800; color:var(--g); }
</style>
</head>
<body>
<div class="win">
  <div class="grid">
    <div class="panel">
      <div class="p-t">Connected assets</div>
      <div class="asset"><span class="n">Battery</span><span class="v">125.4 kWh</span></div>
      <div class="asset"><span class="n">Solar</span><span class="v">64.8 kWh</span></div>
      <div class="asset"><span class="n">EV charger</span><span class="v">32.0 kWh</span></div>
      <div class="asset"><span class="n">Meter</span><span class="v">18.6 kWh</span></div>
    </div>
    <div class="panel">
      <div class="p-t">Network planning</div>
      <div class="map"><svg viewBox="0 0 300 200">
        <g stroke="#16A34A" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M40 100 H260"/><path d="M100 40 V160"/><path d="M200 40 V160"/></g>
        <g fill="#16A34A"><circle cx="100" cy="100" r="5"/><circle cx="200" cy="100" r="5"/></g>
      </svg></div>
    </div>
    <div class="panel">
      <div class="p-t">kWh communications</div>
      <div style="flex:1"></div>
    </div>
    <div class="panel">
      <div class="p-t">Grid services</div>
      <div class="disp"><div class="l">Dispatch response</div><div class="v">215 kW</div></div>
      <div class="disp"><div class="l">Verified</div><div class="v">✓</div></div>
    </div>
  </div>
  <div class="center"><div class="n">kWh</div></div>
</div>
</body>
</html>
